name: U-Art Fast CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter_test:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Code Formatting Check (Informational)
        run: dart format --output=none . || true
        
      - name: Analyze Code
        run: flutter analyze
        
      - name: Run Flutter Tests
        run: flutter test --coverage

  backend_test:
    name: Backend API & Crawler Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Test Dependencies
        run: |
          pip install -r backend/requirements-test.txt

      - name: Run Python Crawler & Smart Merge Tests
        run: |
          python -m pytest backend/tests/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node API Dependencies
        run: |
          cd backend/api
          npm ci

      - name: Run Node.js API Tests
        run: |
          cd backend/api
          npm test
